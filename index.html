<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#e8edf7;background:#0b0e14;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #a9b9ff;outline-offset:2px}.app{display:grid;grid-template-columns:235px minmax(0,1fr) 355px;min-height:100vh}.sidebar{background:#10141d;border-right:1px solid #252b39;padding:24px 15px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.02em;font-size:17px;margin:3px 10px 35px}.brandmark{width:31px;height:31px;background:#b0a4ff;border-radius:10px;color:#151322;display:grid;place-items:center}.eyebrow{color:#77849b;text-transform:uppercase;letter-spacing:.15em;font-size:10px;font-weight:800;margin:24px 11px 10px}.nav{width:100%;border:0;background:transparent;color:#9fa9bd;text-align:left;padding:12px;border-radius:10px;display:flex;gap:12px;align-items:center}.nav.active{background:#25263e;color:#dedaff}.nav:hover{background:#202634}.sidebar-note{font-size:12px;line-height:1.7;color:#78849a;padding:14px;margin-top:35px;border:1px solid #283043;border-radius:12px}.main{padding:35px clamp(20px,3vw,48px);min-width:0}.topline{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.overline{font-size:11px;color:#a99aff;letter-spacing:.18em;font-weight:800;text-transform:uppercase}h1{font-size:31px;letter-spacing:-.045em;margin:10px 0 9px}p.sub{color:#8995a9;margin:0 0 29px;line-height:1.6}.button{border:1px solid #343c4e;background:#1a2130;color:#e4e9f5;border-radius:9px;padding:10px 13px;font-weight:650}.button:hover{background:#283148}.button.primary{background:#afa2ff;color:#151322;border-color:#afa2ff}.button.primary:hover{background:#c3baff}.button.small{padding:7px 10px;font-size:12px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.sectiontitle{display:flex;align-items:center;justify-content:space-between;margin:24px 0 13px;gap:10px}.sectiontitle h2{font-size:15px;margin:0}.muted{color:#8793a7;font-size:12px}.instances{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}.instance{background:#151b26;border:1px solid #2b3445;border-radius:15px;padding:16px;min-height:155px}.instance.selected{border-color:#a99bff;box-shadow:0 0 0 1px #a99bff33}.instance h3{margin:0 0 5px;font-size:15px}.instance .meta{font-size:11px;color:#8995a9}.instance-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:17px}.chip{background:#292c43;color:#bdb6ff;border-radius:6px;font-size:10px;padding:4px 7px}.preview-stage{margin-top:23px;min-height:320px;border:1px solid #303849;border-radius:16px;background:radial-gradient(circle at 35% 20%,#242c3c,#10151f 68%);padding:35px;display:flex;justify-content:center;align-items:center;overflow:hidden}.preview-surface{width:min(100%,500px);min-height:220px;position:relative;transition:background .12s,border-radius .12s,box-shadow .12s,border .12s}.preview-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.preview-input{padding:15px 16px;margin-top:15px;opacity:.86}.preview-buttons{display:flex;gap:9px;margin-top:18px}.preview-button{padding:9px 15px;font-weight:700}.inspector{background:#111620;border-left:1px solid #283041;padding:24px 22px;max-height:100vh;overflow:auto;position:sticky;top:0}.inspector h2{margin:0;font-size:18px}.inspector-head{display:flex;justify-content:space-between;align-items:center}.fieldgroup{margin-top:27px}.fieldgroup h3{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#929eb6;border-bottom:1px solid #2c3443;padding-bottom:11px}.field{padding:12px 0;border-bottom:1px solid #202837}.field-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:11px}.field-name{font-weight:600;font-size:12px}.value{color:#b6abff;font-size:12px;font-variant-numeric:tabular-nums}.controlrow{display:flex;gap:12px;align-items:center}.controlrow input[type=range]{flex:1;accent-color:#b5a5ff;min-width:30px}.controlrow input[type=color]{width:38px;height:30px;border:1px solid #434c61;background:transparent;border-radius:7px;padding:2px}.controlrow input[type=checkbox]{accent-color:#ad9dff;width:17px;height:17px}.controlrow select,.controlrow input[type=text]{width:100%;background:#1d2532;border:1px solid #394257;border-radius:7px;color:#e5e9f4;padding:9px}.swatch{height:32px;width:100%;border-radius:6px;border:1px solid #4b556a}.mini{width:78px;min-width:78px;height:47px;border:1px solid #323b4c;background:#202837;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}.mini-line{width:56px}.mini-border{width:52px;height:27px}.footer-note{font-size:11px;color:#6d7b90;margin-top:20px;line-height:1.6}.empty{padding:20px;color:#a6b0c3;border:1px dashed #455069;border-radius:12px}.popup{min-height:100vh;display:grid;place-items:center;padding:30px;background:radial-gradient(circle at 30% 20%,#303748,#10141d 70%)}.popup .preview-surface{width:min(100%,620px)}.popup-bar{position:fixed;top:12px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:center;color:#d3d7e3;font-size:12px;z-index:2}.popup-bar button{background:#2b3242;border:1px solid #596075;border-radius:6px;color:white;padding:5px 10px}@media(max-width:1100px){.app{grid-template-columns:190px minmax(0,1fr)}.inspector{grid-column:2;position:static;max-height:none;border-left:0;border-top:1px solid #283041}}@media(max-width:690px){.app{display:block}.sidebar{padding:12px}.brand{margin:0 0 8px}.sidebar-note,.eyebrow{display:none}.nav{display:inline-flex;width:auto}.main{padding:22px 15px}.inspector{padding:20px}.preview-stage{padding:18px}}

/* Isolated Immergold chat mock styles, modeled after the NiceGUI CLI interface. */
.im-chat{display:flex;flex-direction:column;width:100%;height:440px;min-width:0;background:var(--im-bg);color:var(--im-fg);font-size:var(--im-font);font-family:system-ui,sans-serif;border:var(--im-border) solid var(--im-line);border-radius:var(--im-radius);overflow:hidden}

.im-brand{color:var(--im-accent);font-weight:800;font-size:1.15em;margin-right:6px}.im-tab{color:#87909f}.im-tab.active{color:var(--im-accent)}.im-spacer{flex:1}.im-gateway,.im-ready{color:#929aaa}.im-gateway i,.im-ready i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7fd962;margin-right:4px}.im-ready i{background:#6b7280}.im-toggle{color:#a7aebc}
.im-body{display:flex;min-height:0;flex:1}.im-sidebar{width:var(--im-sidewidth);flex:none;min-width:0;background:var(--im-sidebar);border-right:1px solid var(--im-line);padding:9px 0;overflow:auto}
.im-new{background:transparent;border:0;color:var(--im-accent);text-align:left;width:100%;padding:8px 13px;font-size:.87em}.im-search{padding:9px 13px;color:#697381;border-bottom:1px solid var(--im-line);font-size:.85em}.im-chatitem{padding:9px 12px;color:#818b99;font-size:.87em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.im-chatitem.active{background:var(--im-bg);color:var(--im-fg);border-left:2px solid var(--im-accent)}
.im-main{display:flex;flex-direction:column;min-width:0;flex:1}.im-transcript{overflow:auto;flex:1;padding:15px 18px}.im-ascii{font-size:.48em;line-height:1.2;color:var(--im-accent);white-space:nowrap;overflow:hidden;margin:0 0 9px}.im-subtitle{font-size:.75em;color:#717d8e;margin:4px 0}.im-message{display:flex;gap:10px;margin-top:var(--im-gap);font-size:.88em;line-height:1.65}.im-user{align-items:flex-start}.im-prompt{color:var(--im-accent);font-weight:800}.im-message p{margin:0 0 9px}.im-message small{color:#7c8491;display:block;font-size:.8em}.im-steps{margin-bottom:8px}.im-step{font-size:.83em;color:#8995a5;padding:2px 0}.im-orange{color:var(--im-accent)}.im-tool{color:var(--im-tool)}.im-faded{color:#7fd962}.im-stats{font-size:.74em;color:#6e7989;margin-top:6px}
.im-composer{min-height:var(--im-composer);background:var(--im-input);border-top:1px solid var(--im-line);display:flex;align-items:center;gap:10px;padding:10px 17px}.im-placeholder{font-size:.75em;color:#768294;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.im-mic{color:#9aa5b4;font-size:1.3em}.im-send{background:var(--im-accent);color:#101217;border-radius:4px;padding:4px 7px}.im-status{height:24px;flex:none;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:0 13px;border-top:1px solid var(--im-line);color:#788393;font-size:.69em;white-space:nowrap;overflow:hidden}
.im-chat .im-new{cursor:default}.im-chat .im-new:focus-visible{outline:none}
.preview-stage:has(.im-chat){padding:14px;align-items:stretch}.popup:has(.im-chat){padding:46px 16px 16px}.popup .im-chat{height:calc(100vh - 64px);max-width:none}
</style><script src="experiments/immergold-chat/renderer.js"></script></head><body><div id="root"></div><script>
'use strict';
const KEY='gui-playground-v1', channel=typeof BroadcastChannel!=='undefined'?new BroadcastChannel(KEY):null;
const defaults={background:'#1d2331',foreground:'#f1f1ff',accent:'#b7a7ff',borderColor:'#64708b',borderWidth:2,radius:18,opacity:95,padding:24,shadow:24,fontSize:16,lineWidth:4,lineColor:'#b7a7ff',showBorder:true,borderStyle:'solid'};
const groups=[{name:'Surface',fields:[['background','Background','color'],['foreground','Text color','color'],['accent','Accent','color'],['opacity','Opacity','range',20,100,1,'%'],['padding','Padding','range',8,55,1,'px'],['radius','Corner radius','range',0,45,1,'px'],['shadow','Shadow strength','range',0,60,1,'px']]},{name:'Border',fields:[['showBorder','Show border','toggle'],['borderColor','Border color','color'],['borderWidth','Border width','range',0,14,1,'px'],['borderStyle','Border style','select',['solid','dashed','dotted','double']]]},{name:'Typography & lines',fields:[['fontSize','Font size','range',11,28,1,'px'],['lineColor','Line color','color'],['lineWidth','Line width','range',1,18,1,'px']]}];
const templates=['Glass card','Chat panel','Timer widget','Immergold chat'];
function configFor(template){return template==='Immergold chat'?{...window.ImmergoldChat.defaults}:{...defaults}}
function groupsFor(item){return item.template==='Immergold chat'?[...groups,...window.ImmergoldChat.groups]:groups}
let state=load(), selected=state.selected||state.instances[0].id, currentView='windows';
function id(){return 'w'+Math.random().toString(36).slice(2,9)}
function initial(){return {selected:'immergold',instances:[{id:'sample',name:'Glass card 01',template:'Glass card',config:{...defaults}},{id:'chat',name:'Chat panel 01',template:'Chat panel',config:{...defaults,background:'#18202c',accent:'#81c9ff',radius:12}},{id:'immergold',name:'Immergold chat 01',template:'Immergold chat',config:configFor('Immergold chat')}]}}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.instances)&&v.instances.length)return v}catch{}return initial()}
const SAVE_DELAY_MS=500;
let saveTimer=null;
function flushSave(){
  if(saveTimer!==null){clearTimeout(saveTimer);saveTimer=null;}
  state.selected=selected;
  const serialized=JSON.stringify(state);
  localStorage.setItem(KEY,serialized);
  channel?.postMessage('refresh');
  if(window.pywebview?.api?.save_state){
    window.pywebview.api.save_state(serialized).catch(console.error);
  }
}
function save(){
  if(saveTimer!==null)clearTimeout(saveTimer);
  saveTimer=setTimeout(flushSave,SAVE_DELAY_MS);
}
function get(){return state.instances.find(x=>x.id===selected)||state.instances[0]}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function createSurface(instance){if(instance.template==='Immergold chat')return window.ImmergoldChat.render(instance,esc);const c=instance.config;const border=c.showBorder?`${c.borderWidth}px ${c.borderStyle} ${c.borderColor}`:'0px solid transparent';const shadow=`0 18px ${c.shadow*2}px rgba(0,0,0,.6)`;let inner='';
if(instance.template==='Timer widget')inner=`<div class="preview-head"><strong>◷ &nbsp; Focus timer</strong><span>•••</span></div><div style="font-size:56px;font-weight:750;letter-spacing:-.06em;text-align:center;margin:10px 0">24:59</div><div style="text-align:center;opacity:.7">Deep work session</div><div class="preview-buttons" style="justify-content:center"><span class="preview-button" style="background:${c.accent};color:#151722;border-radius:8px">Pause</span><span class="preview-button" style="border:1px solid ${c.borderColor};border-radius:8px">Reset</span></div>`;
else if(instance.template==='Chat panel')inner=`<div class="preview-head"><strong>✦ &nbsp; Assistant</strong><span style="opacity:.65;font-size:12px">● Online</span></div><div style="opacity:.75;font-size:13px">What would you like to explore today?</div><div class="preview-input" style="border:1px solid ${c.borderColor};border-radius:9px">Ask anything… &nbsp; ↗</div><div style="margin-top:18px;background:${c.accent};color:#151722;border-radius:8px;display:inline-block;padding:9px 14px;font-size:12px;font-weight:700">Send message</div>`;
else inner=`<div class="preview-head"><strong>✦ &nbsp; Example surface</strong><span style="opacity:.6;font-size:12px">Preview</span></div><div style="font-size:21px;font-weight:750;letter-spacing:-.03em">Design in real time.</div><div style="opacity:.7;font-size:13px;line-height:1.7;margin-top:8px">Every control updates this independent window configuration.</div><div style="height:${c.lineWidth}px;background:${c.lineColor};margin:22px 0;border-radius:9px"></div><span class="preview-button" style="background:${c.accent};color:#151722;border-radius:8px;display:inline-block">Example button</span>`;
return `<div class="preview-surface" style="background:${c.background};color:${c.foreground};opacity:${c.opacity/100};border:${border};border-radius:${c.radius}px;padding:${c.padding}px;box-shadow:${shadow};font-size:${c.fontSize}px">${inner}</div>`}
function fieldHtml(f,c){const [key,label,type,a,b,step,unit]=f;const v=c[key];let control='',example='';
if(type==='range'){control=`<input aria-label="${label}" data-key="${key}" type="range" min="${a}" max="${b}" step="${step}" value="${v}">`;if(key==='lineWidth'||key==='borderWidth'||key==='radius')example=`<div class="mini">${key==='lineWidth'?`<div class="mini-line" style="height:${v}px;background:${c.lineColor}"></div>`:`<div class="mini-border" style="border:${key==='borderWidth'?v:c.borderWidth}px ${c.borderStyle} ${c.borderColor};border-radius:${key==='radius'?v:c.radius}px"></div>`}</div>`;}
else if(type==='color'){control=`<input aria-label="${label}" data-key="${key}" type="color" value="${v}"><span style="font-size:12px;color:#b4bfd3">${v}</span>`;example=`<div class="mini"><div style="width:55px;height:25px;background:${v};border-radius:5px"></div></div>`;}
else if(type==='toggle')control=`<input aria-label="${label}" data-key="${key}" type="checkbox" ${v?'checked':''}>`;
else if(type==='select')control=`<select aria-label="${label}" data-key="${key}">${a.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`;
return `<div class="field"><div class="field-head"><span class="field-name">${label}</span><span class="value" id="val-${key}">${type==='range'?v+(unit||''):type==='toggle'?(v?'On':'Off'):type==='select'?v:''}</span></div><div class="controlrow">${control}${example}</div></div>`}
function inspector(){const item=get();return `<aside class="inspector"><div class="inspector-head"><h2>Properties</h2><span class="chip">LIVE</span></div><p class="sub" style="font-size:12px;margin:8px 0 0">Editing ${esc(item.name)} · independent configuration</p>${groupsFor(item).map(g=>`<section class="fieldgroup"><h3>${g.name}</h3>${g.fields.map(f=>fieldHtml(f,item.config)).join('')}</section>`).join('')}<div class="toolbar" style="margin-top:22px"><button class="button small" data-action="reset">Reset</button><button class="button small" data-action="export">Export JSON</button><button class="button small" data-action="import">Import JSON</button></div><div class="footer-note">Changes are saved locally. Separate instances retain separate settings. Pop-out windows sync while open.</div></aside>`}
function render(){if(new URLSearchParams(location.hash.slice(1)).has('window'))return renderPopup();const item=get();document.getElementById('root').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><span class="brandmark">✦</span> GUI Playground</div><div class="eyebrow">Workspace</div><button class="nav active">▦ &nbsp; Windows</button><button class="nav" data-action="new">＋ &nbsp; New instance</button><div class="sidebar-note">A sandbox for experimenting with UI properties, component styles and independent windows.<br><br>No agent or backend connection.</div></aside><main class="main"><div class="topline"><div><div class="overline">DESIGN LAB / WORKSPACE</div><h1>Experiment launcher</h1></div><div class="toolbar"><button class="button" data-action="duplicate">Duplicate selected</button><button class="button primary" data-action="new">＋ New instance</button></div></div><p class="sub">Select an experiment, edit its settings, and launch separate desktop windows.</p><div class="sectiontitle"><h2>Instances</h2><span class="muted">${state.instances.length} independent configurations</span></div><div class="instances">${state.instances.map(x=>`<div class="instance ${x.id===selected?'selected':''}" data-select="${x.id}"><div class="topline"><span class="chip">${esc(x.template)}</span><span class="muted">${x.id===selected?'● Selected':''}</span></div><h3 style="margin-top:14px">${esc(x.name)}</h3><div class="meta">Custom properties · locally saved</div><div class="instance-actions"><button class="button small" data-action="select" data-id="${x.id}">Edit</button><button class="button small" data-action="open" data-id="${x.id}">↗ Launch window</button><button class="button small" data-action="clone" data-id="${x.id}">Copy</button><button class="button small" data-action="delete" data-id="${x.id}" aria-label="Delete ${esc(x.name)}">×</button></div></div>`).join('')}</div><div class="sectiontitle"><h2>External window · ${esc(item.name)}</h2></div><div class="empty">Click <strong>Launch window</strong> to render the selected experiment in its own native desktop window. Changes made in the inspector synchronize to launched windows.</div></main>${inspector()}</div>`;bind()}
function bind(){
  document.querySelectorAll('[data-key]').forEach(el => {
    el.addEventListener('input', () => {
      const item = get();
      const key = el.dataset.key;
      item.config[key] = el.type === 'checkbox' ? el.checked : el.type === 'range' ? Number(el.value) : el.value;
      save();
      if(document.getElementById('stage'))document.getElementById('stage').innerHTML=createSurface(item);
      const val = document.getElementById('val-' + key);
      if (val) val.textContent = el.type === 'range' ? el.value + (key === 'opacity' ? '%' : 'px') : el.type === 'checkbox' ? (el.checked ? 'On' : 'Off') : el.type === 'select' ? el.value : '';
      document.querySelectorAll('.mini').forEach(mini => {
        const field = mini.closest('.field');
        const input = field && field.querySelector('[data-key]');
        if (!input) return;
        const k = input.dataset.key, c = item.config;
        if (k === 'lineWidth') mini.innerHTML = '<div class="mini-line" style="height:' + c.lineWidth + 'px;background:' + c.lineColor + '"></div>';
        else if (k === 'borderWidth' || k === 'radius') mini.innerHTML = '<div class="mini-border" style="border:' + c.borderWidth + 'px ' + c.borderStyle + ' ' + c.borderColor + ';border-radius:' + c.radius + 'px"></div>';
        else if (input.type === 'color') mini.innerHTML = '<div style="width:55px;height:25px;background:' + c[k] + ';border-radius:5px"></div>';
      });
    });
  });
  bindActions();
}
function bindActions(){document.querySelectorAll('[data-action]').forEach(b=>{b.onclick=e=>{e.stopPropagation();action(b.dataset.action,b.dataset.id)}})}
function action(type,target){const item=state.instances.find(x=>x.id===target)||get();if(type==='select'){selected=item.id;return render()}if(type==='new'){const t=prompt('Choose experiment: Glass card, Chat panel, Timer widget, or Immergold chat','Immergold chat');if(t===null)return;const template=templates.find(x=>x.toLowerCase()===t.trim().toLowerCase())||'Glass card';const n={id:id(),name:template+' '+String(state.instances.length+1).padStart(2,'0'),template,config:configFor(template)};state.instances.push(n);selected=n.id;save();return render()}if(type==='duplicate'||type==='clone'){const n={...item,id:id(),name:item.name+' copy',config:{...item.config}};state.instances.push(n);selected=n.id;save();return render()}if(type==='delete'){if(state.instances.length===1)return alert('Keep at least one instance.');if(!confirm('Delete '+item.name+'?'))return;state.instances=state.instances.filter(x=>x.id!==item.id);if(selected===item.id)selected=state.instances[0].id;save();return render()}if(type==='open'){if(window.pywebview?.api?.open_window){flushSave();window.pywebview.api.open_window(item.id).catch(err=>alert('Window error: '+err));return}alert('Run python launch.py for native desktop windows.');return}if(type==='reset'){item.config=configFor(item.template);save();return render()}if(type==='export'){const blob=new Blob([JSON.stringify({name:item.name,template:item.template,config:item.config},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='gui-'+item.id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}if(type==='import'){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{const data=JSON.parse(await input.files[0].text());if(!data.config||typeof data.config!=='object')throw Error('Missing config');const next={...item.config};for(const g of groupsFor(item))for(const f of g.fields){const [key,,kind,a,b]=f;if(!(key in data.config))continue;const v=data.config[key];if(kind==='range'){if(typeof v!=='number'||!Number.isFinite(v)||v<a||v>b)throw Error('Invalid '+key)}else if(kind==='color'){if(typeof v!=='string'||!/^#[0-9a-fA-F]{6}$/.test(v))throw Error('Invalid '+key)}else if(kind==='toggle'){if(typeof v!=='boolean')throw Error('Invalid '+key)}else if(kind==='select'){if(!a.includes(v))throw Error('Invalid '+key)}next[key]=v}item.config=next;save();render()}catch(err){alert('Could not import: '+err.message)}};input.click()}}
function renderPopup(){const id=new URLSearchParams(location.hash.slice(1)).get('window');const item=state.instances.find(x=>x.id===id);document.getElementById('root').innerHTML=item?`<div class="popup"><div class="popup-bar"><strong>✦ &nbsp;${esc(item.name)}</strong><button onclick="window.close()">Close</button></div>${createSurface(item)}</div>`:'<div class="empty">This instance was deleted. Close this window.</div>';document.title=item?item.name+' — GUI Playground':'GUI Playground'}
function sync(){if(saveTimer!==null)return;state=load();if(!state.instances.some(x=>x.id===selected))selected=state.instances[0].id;render()}
window.guiPlaygroundSync=function(json){try{if(saveTimer!==null)return;const data=JSON.parse(json);if(!Array.isArray(data.instances)||!data.instances.length)return;localStorage.setItem(KEY,json);state=data;if(!state.instances.some(x=>x.id===selected))selected=state.instances[0].id;render()}catch(e){console.error(e)}};
window.addEventListener('pywebviewready',()=>window.pywebview.api.load_state().then(json=>{if(json)window.guiPlaygroundSync(json);else window.pywebview.api.save_state(JSON.stringify(state))}).catch(console.error));
channel?.addEventListener('message',sync);window.addEventListener('storage',e=>{if(e.key===KEY)sync()});render();
</script></body></html>
